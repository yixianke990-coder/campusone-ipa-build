name: Build GongmaoAssistant Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip source
        run: |
          unzip -o GongmaoAssistant-source.zip
          ls -la

      - name: Select latest Xcode
        run: |
          ls /Applications | grep Xcode || true
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST_XCODE" ]; then sudo xcode-select -s "$LATEST_XCODE"; fi
          xcodebuild -version

      - name: Build unsigned app
        run: |
          cd GongmaoAssistant-v0.6.0
          xcodebuild \
            -project CampusOne.xcodeproj \
            -scheme CampusOne \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -1)
          echo "App: $APP_PATH"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP_PATH/Info.plist"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r GongmaoAssistant-unsigned.ipa Payload
          ls -la GongmaoAssistant-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GongmaoAssistant-unsigned-ipa
          path: GongmaoAssistant-unsigned.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.0
          name: GongmaoAssistant v0.6.0 (unsigned)
          files: GongmaoAssistant-unsigned.ipa
